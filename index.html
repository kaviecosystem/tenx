    function decode(b64){
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }
    const frames = [document.getElementById("f0"), document.getElementById("f1")];
    const loaded = [false, false];
    function load(i){
      if(loaded[i]) return;
      frames[i].srcdoc = decode(PAGES[i]);
      loaded[i] = true;
    }
    load(0); // eagerly load the first tab

    document.querySelectorAll(".tab").forEach(t=>{
      t.addEventListener("click", ()=>{
        const i = +t.dataset.i;
        document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
        t.classList.add("active");
        frames.forEach(f=>f.classList.remove("show"));
        load(i);
        frames[i].classList.add("show");
      });
    });
  </script>
